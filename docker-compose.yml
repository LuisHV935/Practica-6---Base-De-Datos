version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_practica6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tienda_db
    ports:
      - "5432:5432"

  app-practica6:
    image: practica6-img
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_practica6_run
    depends_on:
      - db
    environment:
      - ConnectionString=Host=db;Username=postgres;Password=postgres;Database=tienda_db
    stdin_open: true 
    tty: true